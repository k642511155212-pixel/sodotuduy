<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f8ff" />
  <meta name="description" content="Sơ đồ tư duy Nhóm 7 — Quan điểm chủ nghĩa Mác – Lênin về vấn đề dân tộc và thực tiễn Việt Nam" />
  <title>SƠ ĐỒ TƯ DUY NHÓM 7</title>
  <style>
    :root {
      color-scheme: light;
      --ink:#223152;
      --muted:#7180a2;
      --paper:#f7f9ff;
      --header-h:100px;
    }
    * { box-sizing:border-box; }
    html, body { margin:0; width:100%; height:100%; overflow:hidden; }
    body {
      font-family: 'Segoe UI', 'Arial', 'Helvetica Neue', sans-serif;
      color:var(--ink);
      background:var(--paper);
      -webkit-font-smoothing:antialiased;
    }
    .app { width:100%; height:100dvh; display:flex; flex-direction:column; overflow:hidden; }
    .headline {
      flex:none; height:var(--header-h); display:flex; align-items:center;
      justify-content:center; position:relative; z-index:1; padding:12px 22px 8px;
      background:linear-gradient(180deg, #ffffff 0%, rgba(255,255,255,.85) 64%, rgba(255,255,255,0) 100%);
    }
    .header-sticker {
      position:absolute; z-index:0; top:1px; width:96px; height:96px;
      object-fit:contain; pointer-events:none; user-select:none;
      filter:drop-shadow(0 7px 5px rgba(94,98,131,.10));
    }
    .header-sticker.left {left:max(10px,calc(50% - 590px));transform:rotate(-7deg);}
    .header-sticker.right {right:max(10px,calc(50% - 590px));transform:rotate(7deg);}
    h1 {
      margin:0; text-align:center; font-weight:900; line-height:1.1;
      font-size:clamp(20px, 3.1vw, 40px); letter-spacing:0.065em;
      color:#1d315c; text-wrap:balance;
      text-shadow:0 2px 0 rgba(235,241,255,.9);
    }
    h1::after {
      content:""; display:block; margin:13px auto 0; width:min(176px,34vw); height:5px;
      border-radius:999px; background:linear-gradient(90deg,#8e7ded,#60bcd8,#e7a157,#f06d8a);
    }
    .map-shell { flex:1; min-height:0; position:relative; overflow:hidden; }
    .map-shell::before {
      content:""; position:absolute; inset:0; pointer-events:none;
      background:
        radial-gradient(ellipse 42% 50% at 50% 48%, rgba(168,182,250,.18), transparent 74%),
        radial-gradient(ellipse 42% 55% at 10% 75%, rgba(248,205,225,.19), transparent 76%),
        radial-gradient(ellipse 35% 45% at 90% 12%, rgba(181,238,224,.24), transparent 77%);
    }
    #mindmap { display:block; width:100%; height:100%; touch-action:none; cursor:grab; }
    #mindmap.dragging { cursor:grabbing; }
    #background-grid { pointer-events:none; }
    .edge { fill:none; stroke-linecap:round; stroke-linejoin:round; opacity:.78; }
    .node { cursor:pointer; outline:none; }
    .node:focus-visible .node-border { stroke:#192342; stroke-width:2.8; }
    .node .shape { filter:url(#nodeShadow); }
    .node text { user-select:none; pointer-events:none; }
    .node:hover .node-border { stroke-width:2.4; }
    .node:hover .shape { filter:url(#hoverShadow); }
    .node .expand-dot { transition:transform .18s ease; }
    .node:hover .expand-dot { transform:scale(1.1); transform-box:fill-box; transform-origin:center; }
    .controls {
      position:absolute; z-index:4; right:19px; bottom:19px; display:flex; gap:8px;
    }
    .controls button {
      width:39px; height:39px; display:grid; place-items:center;
      border:1px solid rgba(114,134,183,.20); border-radius:13px;
      background:rgba(255,255,255,.94); box-shadow:0 6px 18px rgba(52,76,140,.10);
      color:#40547d; cursor:pointer; -webkit-tap-highlight-color:transparent;
    }
    .controls button:hover { background:#edf2ff; color:#1d315c; transform:translateY(-1px); }
    .controls svg { width:19px; height:19px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
    #mascots { pointer-events:none; user-select:none; }
    .chapter-mascot { filter:drop-shadow(0 5px 3px rgba(76,79,108,.09)); }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    @media(max-width:700px) {
      :root { --header-h:82px; }
      h1 { font-size:clamp(19px,5vw,27px); letter-spacing:.025em; }
      h1::after { margin-top:10px; height:4px; }
      .controls { right:12px; bottom:calc(12px + env(safe-area-inset-bottom)); gap:6px; }
      .controls button { width:37px; height:37px; border-radius:11px; }
      .header-sticker {width:57px; height:57px; top:12px;}
      .header-sticker.left {left:6px;}
      .header-sticker.right {right:6px;}
    }
    @media(max-width:470px) {
      .header-sticker {width:42px; height:42px; top:17px; opacity:.9;}
      h1 {padding:0 37px; font-size:clamp(18px,4.7vw,22px);}
    }
    @media(prefers-reduced-motion:reduce) {
      *,*:before,*:after { transition:none !important; animation:none !important; }
    }
    @media print {
      @page { size:A4 landscape; margin:8mm; }
      html,body,.app { width:100%;height:100%;overflow:hidden;background:white; }
      .headline { height:55px; }
      h1 {font-size:23px;} h1::after {height:3px;margin-top:6px;}
      .controls { display:none !important; }
      .header-sticker {width:47px;height:47px;top:0;}
      .map-shell::before {display:none;}
    }
  </style>
</head>

        <linearGradient id="rootBorder" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d5e3ff"/><stop offset="1" stop-color="#d5c8ff"/></linearGradient>
      </defs>
      <rect id="background-grid" x="0" y="0" width="100%" height="100%" fill="url(#dots)" opacity=".65" />

      <button type="button" id="fit" aria-label="Xem toàn bộ" title="Xem toàn bộ"><svg viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button>
      <button type="button" id="reset" aria-label="Thu gọn sơ đồ" title="Thu gọn sơ đồ"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/><path d="m17 4 3 3-3 3M17 14l3 3-3 3"/></svg></button>
    </div>
  </main>
</div>

      {text:'Quốc phòng – an ninh',children:['Bảo vệ biên giới','Thế trận lòng dân','Đối thoại · hòa giải','Giữ vững đoàn kết']},
      {text:'Ba ưu tiên',children:['Hạ tầng + sinh kế','Giáo dục + y tế','Thực thi + giám sát']}
    ]}
  ]
};

let serial=0;
function normalize(raw,parent=null,depth=0) {
  const node = typeof raw==='string' ? {text:raw} : {...raw};
  node.id = 'n'+(++serial);
  node.parent=parent;
  node.depth=depth;
  if(parent) { node.color=node.color||parent.color; node.pale=node.pale||parent.pale; }
  node.side=depth===0?0:(depth===1?(DATA.children.indexOf(raw)<3?-1:1):parent.side);
  // Mở sẵn chương lý luận trung tâm; các chương khác có thể mở bằng một cú nhấp.
  node.expanded=depth===0 || (depth===1 && DATA.children.indexOf(raw)===2);
  node.children=(node.children||[]).map(child=>normalize(child,node,depth+1));
  return node;
}
const root=normalize(DATA);
const byId=new Map();
(function buildIndex(n){byId.set(n.id,n);n.children.forEach(buildIndex);})(root);
const svg=document.querySelector('#mindmap');
const edges=document.querySelector('#edges');
const nodesLayer=document.querySelector('#nodes');
const mascotsLayer=document.querySelector('#mascots');
const viewport=document.querySelector('#viewport');
const svgNS='http://www.w3.org/2000/svg';
let width=1,height=1,zoom=1,tx=0,ty=0,extents=null;
const SIZES={0:{w:278,h:96},1:{w:224,h:64},2:{w:203,h:56},3:{w:190,h:48}};
const X={0:0,1:343,2:655,3:945};
const GAPS={1:36,2:10,3:7};
function dims(n){return SIZES[Math.min(n.depth,3)];}
function kids(n){return n.expanded?n.children:[];}
function totalHeight(n){
  const cc=kids(n);
  if(!cc.length) return dims(n).h+11;
  const gap=GAPS[Math.min(n.depth+1,3)];
  return Math.max(dims(n).h+12,cc.reduce((sum,ch)=>sum+totalHeight(ch),0)+gap*(cc.length-1));
}
function position(n,y){
  n.x=n.side*X[Math.min(n.depth,3)]; n.y=y;
  const children=kids(n); if(!children.length)return;
  const gap=GAPS[Math.min(n.depth+1,3)];
  const total=children.reduce((s,c)=>s+totalHeight(c),0)+gap*(children.length-1);
  let at=y-total/2;
  for(const child of children){const h=totalHeight(child);position(child,at+h/2);at+=h+gap;}
}
function computeLayout(){
  root.x=0;root.y=0;
  [-1,1].forEach(side=>{
    const arr=kids(root).filter(n=>n.side===side);
    const gap=GAPS[1];
    const total=arr.reduce((sum,n)=>sum+totalHeight(n),0)+Math.max(0,arr.length-1)*gap;
    let y=-total/2;
    arr.forEach(n=>{let h=totalHeight(n);position(n,y+h/2);y+=h+gap;});
  });
  let x1=Infinity,y1=Infinity,x2=-Infinity,y2=-Infinity;
  visibleNodes().forEach(n=>{let {w,h}=dims(n);x1=Math.min(x1,n.x-w/2-18);x2=Math.max(x2,n.x+w/2+18);y1=Math.min(y1,n.y-h/2-20);y2=Math.max(y2,n.y+h/2+20);});
  // Account for protruding sticker silhouettes in auto-fit without hiding content.
  visibleNodes().filter(n=>n.depth===1).forEach(n=>{
    const outer=n.x+n.side*(dims(n).w/2+42);
    x1=Math.min(x1,outer-42);x2=Math.max(x2,outer+42);
    y1=Math.min(y1,n.y-49);y2=Math.max(y2,n.y+49);
  });
  extents={x1,y1,x2,y2};
}
function visibleNodes(){const arr=[];function go(n){arr.push(n);kids(n).forEach(go);}go(root);return arr;}
function elt(tag,attrs={},text=null){const e=document.createElementNS(svgNS,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,String(v));if(text!==null)e.textContent=text;return e;}
function clamp(x,a,b){return Math.min(b,Math.max(a,x));}
function hexRgb(h){let s=h.replace('#','');return [0,2,4].map(i=>parseInt(s.slice(i,i+2),16));}
function rgba(hex,a){const v=hexRgb(hex);return `rgba(${v.join(',')},${a})`;}
function splitLines(s,depth){
  if(depth===0)return ['VẤN ĐỀ DÂN TỘC'];
  const limit=depth===1?19:depth===2?23:24;
  if(s.length<=limit) return [s];
  const words=s.split(' '),out=[],maxLines=2;let current='';
  for(const word of words){const next=current?current+' '+word:word;
    if(next.length>limit && current && out.length<maxLines-1){out.push(current);current=word;}
    else current=next;
  }
  if(current)out.push(current);
  return out;
}
function renderEdge(n){
  if(!n.parent)return;
  const p=n.parent,from=dims(p),to=dims(n),sg=n.side;
  const x0=p.x+sg*from.w/2, x1=n.x-sg*to.w/2;
  const dx=Math.abs(x1-x0), bend=Math.max(52,dx*.48);
  const d=`M${x0},${p.y} C${x0+sg*bend},${p.y} ${x1-sg*bend},${n.y} ${x1},${n.y}`;
  const tone=n.color||'#657bc4';
  edges.append(elt('path',{d,class:'edge',stroke:rgba(tone,n.depth===1?.82:.50),'stroke-width':n.depth===1?7.8:n.depth===2?3.7:2.2}));
  if(n.depth===1){ edges.append(elt('circle',{cx:x0,cy:p.y,r:5.8,fill:tone})); }
}
function renderNode(n){
  const {w,h}=dims(n),left=-w/2,top=-h/2;
  const group=elt('g',{class:'node',transform:`translate(${n.x},${n.y})`,tabindex:0,role:'button','aria-label':n.text+(n.children.length?(n.expanded?' (thu gọn)':' (mở rộng)'):''),'aria-expanded':!!(n.children.length&&n.expanded)});
  let main=n.depth===1,sub=n.depth===2,rootNode=n.depth===0;
  if(rootNode){
    group.append(elt('rect',{class:'shape node-border',x:left,y:top,width:w,height:h,rx:26,fill:'url(#rootGrad)',stroke:'url(#rootBorder)','stroke-width':3}));
    group.append(elt('rect',{x:left+11,y:top+10,width:w-22,height:h-20,rx:20,fill:'none',stroke:'rgba(255,255,255,.33)','stroke-width':1.1}));
    group.append(elt('text',{x:0,y:-7,fill:'#ffffff','text-anchor':'middle','font-size':19,'font-weight':800,'letter-spacing':'.35'},'VẤN ĐỀ DÂN TỘC'));
    group.append(elt('text',{x:0,y:19,fill:'#e9edff','text-anchor':'middle','font-size':11.5,'font-weight':700,'letter-spacing':'1.45'},root.sub));
  } else {
    const fill=main?n.color:n.pale;
    const ink=main?'#ffffff':'#283a58';
    group.append(elt('rect',{class:'shape node-border',x:left,y:top,width:w,height:h,rx:main?19:14,fill,stroke:main?rgba(n.color,.6):rgba(n.color,.35),'stroke-width':1.25}));
    if(!main){group.append(elt('rect',{x:n.side===1?left+1:left+w-6,y:top+6,width:5,height:h-12,rx:2.5,fill:n.color,opacity:sub?'.90':'.60'}));}
    const lines=splitLines(n.text,n.depth);
    const font=main?14.3:sub?13.4:12.7;
    const target=main?0:0;
    const start=target-(lines.length-1)*(font*.60);
    const label=elt('text',{x:0,y:start,'text-anchor':'middle','dominant-baseline':'middle',fill:ink,'font-size':font,'font-weight':main?800:sub?700:560,'letter-spacing':main?'.2':'0'});
    lines.forEach((line,i)=>label.append(elt('tspan',{x:0,dy:i===0?0:font*1.19},line)));
    group.append(label);
    if(n.children.length){
      const dx=n.side===1?w/2-3:-w/2+3;
      const badge=elt('g',{class:'expand-dot'});
      badge.append(elt('circle',{cx:dx,cy:0,r:main?11:9.3,fill:'#ffffff',stroke:n.color,'stroke-width':1.5}));
      badge.append(elt('path',{d:`M${dx-3.4} 0h6.8`,stroke:n.color,'stroke-width':1.65,'stroke-linecap':'round'}));
      if(!n.expanded) badge.append(elt('path',{d:`M${dx} -3.4v6.8`,stroke:n.color,'stroke-width':1.65,'stroke-linecap':'round'}));
      group.append(badge);
    } else {
      group.append(elt('circle',{cx:n.side===1?w/2-6:-w/2+6,cy:0,r:2.7,fill:n.color,opacity:.76}));
    }
  }
  function activate(e){e.stopPropagation();if(n.children.length){
    const opening=!n.expanded;
    if(n.depth===1 && opening && !e.shiftKey) root.children.forEach(ch=>{if(ch!==n)ch.expanded=false;});
    n.expanded=opening;redraw();if(n.depth===1) fit(); else focusOn(n);
  }}
  group.addEventListener('click',activate);
  group.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();activate(e);}});
  nodesLayer.append(group);
}
function renderSticker(n) {
  // Place small companions outside the heading panels: no overlap with text.
  if(n.depth!==1)return;
  const idx=root.children.indexOf(n);
  const w=84,h=82;
  const center=n.x+n.side*(dims(n).w/2+43);
  const sticker=elt('image',{
    x:center-w/2,y:n.y-h/2,width:w,height:h,
    href:STICKERS[idx],'preserveAspectRatio':'xMidYMid meet',
    class:'chapter-mascot','aria-hidden':'true'
  });
  mascotsLayer.append(sticker);
}
function setTransform(){viewport.setAttribute('transform',`translate(${tx},${ty}) scale(${zoom})`);}
function redraw(){computeLayout();edges.replaceChildren();nodesLayer.replaceChildren();mascotsLayer.replaceChildren();const items=visibleNodes();items.forEach(renderEdge);items.filter(n=>n.depth===1).forEach(renderSticker);items.forEach(renderNode);setTransform();}
function fit(){
  if(!extents)return;
  const spanX=Math.max(1,extents.x2-extents.x1),spanY=Math.max(1,extents.y2-extents.y1);
  zoom=clamp(Math.min((width-90)/spanX,(height-80)/spanY),.18,1.15);
  tx=width/2-(extents.x1+spanX/2)*zoom;
  ty=height/2-(extents.y1+spanY/2)*zoom;
  setTransform();
}
function focusOn(n){
  // Keep the clicked topic and its immediate new branches legible instead of
  // shrinking the entire diagram after opening a large subtree.
  const group=[n,...kids(n)];
  const left=Math.min(...group.map(v=>v.x-dims(v).w/2));
  const right=Math.max(...group.map(v=>v.x+dims(v).w/2));
  const top=Math.min(...group.map(v=>v.y-dims(v).h/2));
  const bottom=Math.max(...group.map(v=>v.y+dims(v).h/2));
  const fitZoom=Math.min((width-96)/Math.max(1,right-left),(height-112)/Math.max(1,bottom-top));
  zoom=clamp(Math.min(1.28,fitZoom),.38,1.42);
  tx=width/2-(left+right)/2*zoom;
  ty=height/2-(top+bottom)/2*zoom;
  setTransform();
}
function zoomBy(f,cx=width/2,cy=height/2){
  const next=clamp(zoom*f,.16,2.65),k=next/zoom;
  tx=cx-(cx-tx)*k;ty=cy-(cy-ty)*k;zoom=next;setTransform();
}
function resize(){const box=svg.getBoundingClientRect();width=Math.max(1,box.width);height=Math.max(1,box.height);svg.setAttribute('viewBox',`0 0 ${width} ${height}`);fit();}
const pointers=new Map();let previousPinch=null;let moved=false;
function localPoint(e){const b=svg.getBoundingClientRect();return {x:e.clientX-b.left,y:e.clientY-b.top};}
svg.addEventListener('pointerdown',e=>{
  if(e.button!==0&&e.pointerType==='mouse')return;
  const p=localPoint(e);pointers.set(e.pointerId,p);moved=false;
  if(e.target.closest('.node'))return;
  svg.setPointerCapture(e.pointerId);svg.classList.add('dragging');
});
svg.addEventListener('pointermove',e=>{
  if(!pointers.has(e.pointerId))return;
  const newp=localPoint(e),oldp=pointers.get(e.pointerId);pointers.set(e.pointerId,newp);
  if(pointers.size===1){tx+=newp.x-oldp.x;ty+=newp.y-oldp.y;setTransform();}
  else if(pointers.size===2){
    const pp=[...pointers.values()];const dx=pp[0].x-pp[1].x,dy=pp[0].y-pp[1].y;
    const dist=Math.hypot(dx,dy),cx=(pp[0].x+pp[1].x)/2,cy=(pp[0].y+pp[1].y)/2;
    if(previousPinch){zoomBy(dist/previousPinch.dist,cx,cy);tx+=cx-previousPinch.cx;ty+=cy-previousPinch.cy;setTransform();}
    previousPinch={dist,cx,cy};
  }
  moved=true;
});
function pointerStop(e){pointers.delete(e.pointerId);if(pointers.size<2)previousPinch=null;if(pointers.size===0)svg.classList.remove('dragging');}
svg.addEventListener('pointerup',pointerStop);svg.addEventListener('pointercancel',pointerStop);
svg.addEventListener('wheel',e=>{
  e.preventDefault();const p=localPoint(e);zoomBy(Math.exp(-e.deltaY*.00145),p.x,p.y);
},{passive:false});
svg.addEventListener('dblclick',e=>{if(e.target.closest('.node'))return;fit();});
document.querySelector('#zoomIn').addEventListener('click',()=>zoomBy(1.24));
document.querySelector('#zoomOut').addEventListener('click',()=>zoomBy(1/1.24));
document.querySelector('#fit').addEventListener('click',fit);
document.querySelector('#reset').addEventListener('click',()=>{
  byId.forEach(n=>{n.expanded=n.depth===0||(n.depth===1&&root.children.indexOf(n)===2);});redraw();fit();
});
window.addEventListener('keydown',e=>{
  if(e.target.matches('button')||e.target.closest('.node'))return;
  if(e.key==='+'||e.key==='=')zoomBy(1.2);
  if(e.key==='-')zoomBy(1/1.2);
  if(e.key==='0')fit();
});
window.addEventListener('resize',resize);
redraw();resize();
</script>
